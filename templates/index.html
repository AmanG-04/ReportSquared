<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE XBRL Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .stock-select {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: #f9f9f9;
        }
        
        .stock-item {
            display: flex;
            align-items: center;
        }
        
        .stock-item input[type="checkbox"] {
            cursor: pointer;
            margin-right: 8px;
        }
        
        .stock-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            font-size: 13px;
        }
        
        .filing-type {
            display: flex;
            gap: 20px;
            padding: 12px;
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }
        
        .radio-item {
            display: flex;
            align-items: center;
        }
        
        .radio-item input[type="radio"] {
            cursor: pointer;
            margin-right: 8px;
        }
        
        .radio-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            font-size: 14px;
        }
        
        .btn-select-all {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-select-all:hover {
            background: #764ba2;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .status-box {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .status-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .files-list {
            margin-top: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
        }
        
        .files-list h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 4px;
            margin-bottom: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .file-name {
            flex: 1;
            color: #333;
            font-size: 13px;
            word-break: break-all;
        }
        
        .file-download {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-left: 10px;
        }
        
        .file-download:hover {
            background: #764ba2;
        }
        
        .helper-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        
        .success {
            color: #27ae60;
            border-left-color: #27ae60;
            background: #f0fdf4;
        }
        
        .error {
            color: #e74c3c;
            border-left-color: #e74c3c;
            background: #fdf4f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 NSE XBRL Downloader</h1>
        <p class="subtitle">Download consolidated financial filings from NSE</p>
        
        <form id="downloadForm">
            <div class="form-group">
                <label for="periodDate">Period Ended (Quarter End Date)</label>
                <select id="periodDate" required>
                    <option value="">-- Select Quarter --</option>
                    <option value="30-Sep-2025">30-Sep-2025</option>
                    <option value="30-Jun-2025">30-Jun-2025</option>
                    <option value="31-Mar-2025">31-Mar-2025</option>
                    <option value="31-Dec-2024">31-Dec-2024</option>
                    <option value="30-Sep-2024">30-Sep-2024</option>
                    <option value="30-Jun-2024">30-Jun-2024</option>
                    <option value="31-Mar-2024">31-Mar-2024</option>
                    <option value="31-Dec-2023">31-Dec-2023</option>
                    <option value="30-Sep-2023">30-Sep-2023</option>
                    <option value="30-Jun-2023">30-Jun-2023</option>
                    <option value="31-Mar-2023">31-Mar-2023</option>
                    <option value="31-Dec-2022">31-Dec-2022</option>
                    <option value="30-Sep-2022">30-Sep-2022</option>
                    <option value="30-Jun-2022">30-Jun-2022</option>
                    <option value="31-Mar-2022">31-Mar-2022</option>
                    <option value="31-Dec-2021">31-Dec-2021</option>
                </select>
                <div class="helper-text">Select from available quarter-end dates</div>
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label>Select Stocks (Nifty 50)</label>
                    <button type="button" class="btn-select-all" onclick="toggleSelectAll()">Select All</button>
                </div>
                <div class="stock-select" id="stockSelect"></div>
            </div>
            
            <div class="form-group">
                <label>Filing Type</label>
                <div class="filing-type">
                    <div class="radio-item">
                        <input type="radio" id="typeConsolidated" name="filingType" value="consolidated" checked>
                        <label for="typeConsolidated">Consolidated Only</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="typeStandalone" name="filingType" value="standalone">
                        <label for="typeStandalone">Standalone Only</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="typeBoth" name="filingType" value="both">
                        <label for="typeBoth">Both</label>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-download">⬇️ Download Files</button>
                <button type="button" class="btn-clear" onclick="clearSelections()">Clear</button>
            </div>
        </form>
        
        <div class="status-box" id="statusBox" style="display: none;">
            <div class="status-text" id="statusText"></div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="files-list" id="filesList" style="display: none;">
            <h3>📁 Downloaded Files</h3>
            <div id="filesContainer"></div>
        </div>
    </div>

    <script>
        const companies = {{ companies | tojson }};
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            populateStocks();
            loadFiles();
        });
        
        function populateStocks() {
            const container = document.getElementById('stockSelect');
            companies.forEach(company => {
                const div = document.createElement('div');
                div.className = 'stock-item';
                div.innerHTML = `
                    <input type="checkbox" id="${company.symbol}" name="stock" value="${company.symbol}">
                    <label for="${company.symbol}">${company.symbol} - ${company.name}</label>
                `;
                container.appendChild(div);
            });
        }
        
        function setDefaultDate() {
            // Removed - no longer needed with dropdown
        }
        
        function clearSelections() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }
        
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('input[name="stock"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            
            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
            });
        }
        
        function formatDateForNSE(dateStr) {
            // Date is already in NSE format (e.g., "30-Jun-2025")
            return dateStr;
        }
        
        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const selectedSymbols = Array.from(document.querySelectorAll('input[name="stock"]:checked'))
                .map(cb => cb.value);
            
            if (selectedSymbols.length === 0) {
                alert('Please select at least one stock');
                return;
            }
            
            const period = formatDateForNSE(document.getElementById('periodDate').value);
            const filingType = document.querySelector('input[name="filingType"]:checked').value;
            
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            statusText.textContent = 'Starting download...';
            
            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        symbols: selectedSymbols,
                        period: period,
                        filingType: filingType
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Poll for progress
                    const interval = setInterval(async () => {
                        const progressResponse = await fetch('/api/progress');
                        const progress = await progressResponse.json();
                        
                        statusText.textContent = progress.message;
                        
                        if (progress.status === 'completed') {
                            clearInterval(interval);
                            statusBox.classList.add('success');
                            statusText.innerHTML = `✅ ${progress.message}`;
                            setTimeout(loadFiles, 500);
                        }
                    }, 500);
                } else {
                    statusBox.classList.add('error');
                    statusText.textContent = `❌ ${data.message}`;
                }
            } catch (error) {
                statusBox.classList.add('error');
                statusText.textContent = `❌ Error: ${error.message}`;
            }
        });
        
        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                
                const filesList = document.getElementById('filesList');
                const filesContainer = document.getElementById('filesContainer');
                
                if (data.files && data.files.length > 0) {
                    filesList.style.display = 'block';
                    filesContainer.innerHTML = data.files.map(file => `
                        <div class="file-item">
                            <span class="file-name">📄 ${file}</span>
                            <a class="file-download" href="/download/${file}">Download</a>
                        </div>
                    `).join('');
                } else {
                    filesList.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }
    </script>
</body>
</html>
